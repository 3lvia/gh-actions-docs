name: Build, release and test

on:
  push:
    branches: [trunk]
    paths-ignore: ['README.md']
  pull_request:
    branches: [trunk]
    paths-ignore: ['README.md']
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'

jobs:
  build-release:
    name: Build and release
    runs-on: elvia-runner
    env:
      TRIVY_SARIF: 'trivy-results.sarif'
      IMAGE_NAME: 'ghcr.io/${{ github.repository }}'
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from Cabal file
        run: |
          version=$(cat gh-actions-docs.cabal | grep '^version:' | sed -e 's/version:\s*//g')
          echo "VERSION_TAG=v$version" >> "$GITHUB_ENV"
          echo "MAJOR_VERSION_TAG=v$(echo $version | cut -d. -f1)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with cache and push to registry
        uses: docker/build-push-action@v6
        with:
          push: 'true'
          load: 'true'
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/trunk') && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: 'type=registry,ref=${{ env.IMAGE_NAME }}:latest'
          cache-to: 'type=inline'

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          exit-code: '0'
          output: ${{ env.TRIVY_SARIF }}
          ignore-unfixed: 'true'
        env:
          TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.TRIVY_SARIF }}
          category: 'Trivy'

      - name: Create release & tag image if new version
        if: ${{ github.event_name == 'push' }}
        run: |
          latest_version=$(gh release list --json name,isLatest -q '.[] | select(.isLatest == true) | .name')
          if [[ "$latest_version" == "$VERSION_TAG" ]]; then
            echo "Version already released."
          else
            gh release create \
              "$VERSION_TAG" \
              --generate-notes
          fi

          echo "Tagging $IMAGE_NAME:$GITHUB_SHA with version tag: $VERSION_TAG"

          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:$VERSION_TAG"
          docker push "$IMAGE_NAME:$VERSION_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Override major tag
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git fetch --tags
          git tag "$MAJOR_VERSION_TAG" "$VERSION_TAG" -f
          git push --tags -f

  test:
    name: Test
    runs-on: elvia-runner
    needs: [build-release]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run action
        uses: ./
        with:
          ignore-files: 'your/cool/action.yml'
          run-prettier: 'true'
          no-name: 'true'
          no-description: 'true'
          no-toc: 'true'

      - name: Output README for debugging
        if: ${{ github.event_name == 'pull_request' }} # Only output README on PR
        run: cat README.md

      - name: Commit changes
        if: ${{ github.event_name == 'push' }} # Only commit changes to README on push
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add README.md
          git commit -m "Update action documentation"
          git push
